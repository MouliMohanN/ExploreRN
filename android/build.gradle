import java.util.stream.Collectors

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

def getDeviceArchitecture() {
    try {
        def process = "adb shell getprop ro.product.cpu.abi".execute()
        def inputStream = new InputStreamReader(process.inputStream)
        def output = new BufferedReader(inputStream).lines().collect(Collectors.joining("\n"))
        process.waitFor()
        if (process.exitValue() == 0 && output.trim().length() > 0) {
            return output.trim()
        } else {
            return 'arm64-v8a'
        }
    } catch (Exception e) {
        return 'arm64-v8a'
    }
}

// Define a global property for debug ABI filter
project.ext.debugAbiFilter = null
if (gradle.startParameter.taskNames.any { it.contains("debug") }) {
    project.ext.debugAbiFilter = getDeviceArchitecture()
}